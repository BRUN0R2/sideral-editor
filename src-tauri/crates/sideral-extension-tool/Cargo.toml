[package]
name = "sideral-extension-tool"
version = "0.1.0"
description = "Official scaffold, signing and inspection tool for Sideral extensions"
edition = "2024"
rust-version = "1.97"
publish = false

[dependencies]
base64 = { workspace = true }
ed25519-dalek = { workspace = true }
getrandom = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sideral-extension-core = { path = "../sideral-extension-core" }
sideral-extension-package = { path = "../sideral-extension-package" }
tempfile = "3.27.0"
thiserror = { workspace = true }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
expect_used = "deny"
panic = "deny"
unwrap_used = "deny"
