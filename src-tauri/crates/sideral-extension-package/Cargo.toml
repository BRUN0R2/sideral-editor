[package]
name = "sideral-extension-package"
version.workspace = true
description = "Signed archive validation for Sideral extensions"
edition = "2024"
rust-version = "1.97"
publish = false

[dependencies]
base64 = { workspace = true }
ed25519-dalek = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sideral-extension-core = { path = "../sideral-extension-core" }
thiserror = { workspace = true }
zip = { workspace = true }

[dev-dependencies]
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
expect_used = "deny"
panic = "deny"
unwrap_used = "deny"
