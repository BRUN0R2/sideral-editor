[package]
name = "sideral-editor"
version = "0.1.0"
description = "A focused, native code editor"
authors = ["Sideral Editor contributors"]
edition = "2024"
rust-version = "1.97"

[workspace]
members = [
    ".",
    "crates/sideral-extension-core",
    "crates/vscode-legacy-core",
]
resolver = "3"

[workspace.dependencies]
semver = { version = "1.0.28", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
url = "2.5.8"

[lib]
name = "sideral_editor_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
sideral-extension-core = { path = "crates/sideral-extension-core" }
tauri = { version = "2.11.5", features = ["tray-icon"] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-autostart = "2.5.1"
tauri-plugin-opener = "2.5.4"
tauri-plugin-process = "2.3.1"
tauri-plugin-updater = "2.10.1"
tempfile = "3.27.0"
thiserror = { workspace = true }
vscode-legacy-core = { path = "crates/vscode-legacy-core" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
expect_used = "deny"
panic = "deny"
unwrap_used = "deny"
