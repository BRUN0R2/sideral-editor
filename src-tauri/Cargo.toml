[package]
name = "sideral-editor"
version.workspace = true
description = "A focused, native code editor"
authors = ["Sideral Editor contributors"]
edition = "2024"
rust-version = "1.97"

[workspace]
members = [
    ".",
    "crates/sideral-extension-core",
    "crates/sideral-extension-package",
    "crates/sideral-extension-tool",
]
resolver = "3"

[workspace.package]
version = "0.1.1"

[workspace.dependencies]
base64 = { version = "0.23.1", default-features = false, features = ["std"] }
ed25519-dalek = { version = "3.0.0", default-features = false, features = ["fast", "zeroize"] }
getrandom = "0.4.3"
globset = "0.4.20"
semver = { version = "1.0.28", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "process", "sync", "time"] }
url = "2.5.8"
zip = { version = "8.4.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[lib]
name = "sideral_editor_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
base64 = { workspace = true }
getrandom = { workspace = true }
globset = { workspace = true }
portable-pty = "0.9.0"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "stream", "system-proxy"] }
semver = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sideral-extension-core = { path = "crates/sideral-extension-core" }
sideral-extension-package = { path = "crates/sideral-extension-package" }
tauri = { version = "2.12.2", features = ["tray-icon"] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-autostart = "2.5.1"
tauri-plugin-opener = "2.5.4"
tauri-plugin-process = "2.3.1"
tauri-plugin-single-instance = "2.5.2"
tauri-plugin-updater = "2.10.1"
tempfile = "3.27.0"
thiserror = { workspace = true }
tokio = { workspace = true }
url = { workspace = true }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
expect_used = "deny"
panic = "deny"
unwrap_used = "deny"
